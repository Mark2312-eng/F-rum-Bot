<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101827"><title>VISE RUSSIA — Москва</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#141f31;--panel2:#1a2940;--line:#263751;--muted:#91a3bd;--text:#f2f6fc;--gold:#d7ad62;--blue:#4c86c6}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -10%,#203655 0,#0b1220 55%);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
.app{max-width:720px;margin:auto;padding:18px 16px 100px}.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 22px}.brand{font-weight:850;letter-spacing:.08em;font-size:13px;color:var(--gold)}.city{font-size:12px;color:var(--muted)}
.hero{padding:22px;border:1px solid #344b69;border-radius:22px;background:linear-gradient(135deg,#1c3554,#15243a 70%);box-shadow:0 14px 40px #0005}.eyebrow{color:var(--gold);font-size:11px;letter-spacing:.16em;font-weight:800}.hero h1{font-size:27px;line-height:1.12;margin:8px 0}.hero p{margin:0;color:#b5c5d9}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:20px}.stat{background:#0d192a88;border:1px solid #ffffff12;border-radius:13px;padding:11px}.stat b{display:block;font-size:19px}.stat span{font-size:11px;color:var(--muted)}
.section-title{font-size:17px;margin:25px 2px 12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{min-height:102px;text-align:left;border:1px solid var(--line);border-radius:17px;background:linear-gradient(145deg,var(--panel2),var(--panel));color:var(--text);padding:15px;cursor:pointer}.tile:active{transform:scale(.985)}.emoji{font-size:23px;display:block;margin-bottom:9px}.tile b{display:block;font-size:14px}.tile small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.panel{margin-top:16px;padding:17px;border:1px solid var(--line);border-radius:18px;background:#111c2d}.panel p{color:var(--muted);margin:6px 0 0}.hidden{display:none}.nav{position:fixed;bottom:0;left:0;right:0;padding:10px max(14px,calc((100vw - 690px)/2)) calc(10px + env(safe-area-inset-bottom));background:#0b1220ed;backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;justify-content:space-around}.nav button{background:none;border:0;color:var(--muted);font:inherit;font-size:11px;padding:5px 12px}.nav button span{display:block;font-size:19px;margin-bottom:2px}.nav button.active{color:var(--gold)}
.loading{color:var(--muted);font-size:13px}.error{color:#ff9c9c}.profile-name{font-size:20px;font-weight:800}.back{border:0;background:none;color:var(--gold);padding:0 0 14px;font:inherit;cursor:pointer}
.action-list{display:grid;gap:9px;margin-top:14px}.action-card{padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--panel)}.action-card b{display:block}.action-card p{margin:5px 0;color:var(--muted);font-size:12px}.action-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.action-btn{border:1px solid #496383;background:#203753;color:white;border-radius:11px;padding:10px 13px;font:inherit;font-size:13px}.action-btn.primary{background:#8a6837;border-color:#b48a4d}.notice{padding:12px;border-radius:12px;background:#17283d;color:#c7d6e8;margin-top:12px;font-size:13px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* Motion and visual polish */
:root{scroll-behavior:smooth}
body{overflow-x:hidden;padding-bottom:env(safe-area-inset-bottom)}
body:before{content:"";position:fixed;inset:-35% -20% auto;height:70vh;pointer-events:none;z-index:-1;background:radial-gradient(ellipse at 18% 28%,#31578335,transparent 48%),radial-gradient(ellipse at 82% 12%,#b8893a18,transparent 42%);animation:ambient-drift 18s ease-in-out infinite alternate}
@keyframes ambient-drift{from{transform:translate3d(-2%,0,0) scale(1)}to{transform:translate3d(2%,3%,0) scale(1.08)}}
.hero{position:relative;overflow:hidden;isolation:isolate;animation:hero-arrive .7s cubic-bezier(.2,.8,.2,1) both}
.hero:after{content:"";position:absolute;width:210px;height:210px;right:-75px;top:-110px;border:1px solid #d7ad6238;border-radius:50%;box-shadow:0 0 0 22px #d7ad6209,0 0 0 48px #d7ad6206;z-index:-1;animation:halo-pulse 7s ease-in-out infinite}
@keyframes halo-pulse{50%{transform:scale(1.12);opacity:.55}}
@keyframes hero-arrive{from{opacity:0;transform:translateY(15px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
.stat{transition:transform .25s,border-color .25s,background .25s}
.stat:active{transform:scale(.96);border-color:#d7ad6277}
.stat b{font-variant-numeric:tabular-nums;transition:color .25s}
.tile{position:relative;overflow:hidden;isolation:isolate;transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease,background .22s ease;animation:tile-arrive .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--tile-index,0)*35ms)}
.tile:before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 20%,#ffffff0c 48%,transparent 72%);transform:translateX(-120%);transition:transform .65s ease;z-index:-1}
.tile:hover{transform:translateY(-3px);border-color:#54749b;box-shadow:0 10px 24px #0003}
.tile:hover:before{transform:translateX(120%)}
.tile:active{transform:scale(.97)}
@keyframes tile-arrive{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.action-card{animation:card-arrive .38s ease both;transition:border-color .2s,transform .2s}
.action-card:active{transform:scale(.99);border-color:#587ba3}
@keyframes card-arrive{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
.action-btn{transition:transform .16s,filter .16s,background .16s}
.action-btn:hover{filter:brightness(1.12)}
.action-btn:active{transform:scale(.96)}
.nav{padding-bottom:calc(10px + env(safe-area-inset-bottom));transition:background .25s}
.nav button{position:relative;transition:color .2s,transform .2s}
.nav button.active{transform:translateY(-2px)}
.nav button.active:after{content:"";position:absolute;left:25%;right:25%;bottom:-5px;height:2px;border-radius:3px;background:var(--gold);box-shadow:0 0 12px #d7ad6288}
#detail{animation:screen-arrive .32s ease both}
#home{animation:screen-arrive .32s ease both}
@keyframes screen-arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.loading{display:flex;align-items:center;gap:9px}
.loading:before{content:"";width:13px;height:13px;border:2px solid #526985;border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.notice{animation:toast-in .25s ease both}
@keyframes toast-in{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:translateY(0)}}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media(max-width:380px){.app{padding-left:12px;padding-right:12px}.hero{padding:18px}.hero h1{font-size:24px}.stats{gap:6px}.stat{padding:9px 7px}.stat b{font-size:17px}.nav button{padding-left:8px;padding-right:8px}}


/* Player passport */
.passport{position:relative;overflow:hidden;padding:18px;border:1px solid #526b8b;border-radius:19px;background:linear-gradient(135deg,#203b5d,#142238 72%);box-shadow:0 14px 34px #0004;margin-bottom:12px}
.passport:after{content:"";position:absolute;width:180px;height:180px;border:1px solid #d7ad6230;border-radius:50%;right:-85px;top:-90px;box-shadow:0 0 0 18px #d7ad6209,0 0 0 38px #d7ad6206;pointer-events:none}
.passport-head{display:flex;align-items:center;gap:13px;position:relative;z-index:1}
.passport-avatar{width:62px;height:62px;border-radius:18px;border:2px solid #d7ad62;background:linear-gradient(145deg,#456789,#172b43);display:grid;place-items:center;font-size:25px;font-weight:850;color:#f6dfb4;overflow:hidden;flex:none}
.passport-avatar img{width:100%;height:100%;object-fit:cover}
.passport-kicker{font-size:10px;letter-spacing:.16em;color:var(--gold);font-weight:850}
.passport-name{font-size:19px;font-weight:850;line-height:1.2;margin-top:4px;overflow-wrap:anywhere}
.passport-tag{font-size:11px;color:#b7c8dc;margin-top:4px}
.passport-level{margin:17px 0 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.passport-level strong{font-size:14px}
.passport-level span{font-size:11px;color:#b8c7d8}
.passport-seal{font-size:10px;color:#e6c98e;border:1px solid #d7ad6255;border-radius:99px;padding:5px 9px;letter-spacing:.08em}
.passport-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:13px}
.passport-stat{padding:10px 8px;border:1px solid #ffffff17;border-radius:12px;background:#07152555;min-width:0}
.passport-stat b{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis}
.passport-stat span{font-size:9px;letter-spacing:.07em;color:#a9bbd0}
.passport-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.phone-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.phone-app{border:1px solid #344b69;border-radius:16px;background:linear-gradient(145deg,#1d304a,#111d30);color:var(--text);padding:14px 7px;text-align:center;min-height:92px;transition:transform .18s,border-color .18s}
.phone-app:active{transform:scale(.95);border-color:var(--gold)}
.phone-app i{display:block;font-style:normal;font-size:24px;margin-bottom:7px}
.phone-app b{display:block;font-size:11px}
@media(max-width:360px){.passport{padding:14px}.passport-avatar{width:54px;height:54px}.passport-name{font-size:17px}.passport-stat{padding:8px 6px}.passport-stat b{font-size:14px}}


/* District map and inventory showcase */
.city-map{position:relative;overflow:hidden;min-height:300px;border:1px solid #354d6c;border-radius:20px;background:radial-gradient(ellipse at 50% 45%,#243d5c 0,#13243a 58%,#0d192a 100%);padding:15px;margin:12px 0}
.city-map:before,.city-map:after{content:"";position:absolute;pointer-events:none;border:1px solid #8ca6c326;border-radius:48%;transform:rotate(-24deg)}
.city-map:before{width:125%;height:43%;left:-12%;top:29%}
.city-map:after{width:42%;height:130%;left:29%;top:-15%}
.map-road{position:absolute;height:5px;background:#9bb0c51b;border-top:1px solid #a7bdd22c;border-bottom:1px solid #a7bdd20c;border-radius:50%;pointer-events:none}
.map-road.one{width:120%;left:-10%;top:48%;transform:rotate(-22deg)}
.map-road.two{width:120%;left:-10%;top:60%;transform:rotate(28deg)}
.map-road.three{width:100%;left:0;top:32%;transform:rotate(74deg)}
.map-district{position:absolute;z-index:2;border:1px solid #91abc65c;border-radius:14px;background:#1b304bdc;color:#f2f6fc;padding:10px 9px;min-width:105px;text-align:left;box-shadow:0 7px 18px #0004;transition:transform .2s,border-color .2s,background .2s}
.map-district:active{transform:scale(.95)}
.map-district.selected{border-color:var(--gold);background:#55452fdc;box-shadow:0 0 0 2px #d7ad6220,0 8px 22px #0005}
.map-district b{display:block;font-size:12px}
.map-district small{display:block;color:#b7c7da;font-size:10px;margin-top:3px}
.map-district.north{top:10%;left:8%}.map-district.center{top:39%;left:36%}.map-district.industrial{bottom:8%;left:8%}.map-district.south{bottom:8%;right:8%}
.map-pin{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-right:5px;box-shadow:0 0 9px #d7ad62aa}
.map-caption{position:relative;z-index:3;color:#a9bbd0;font-size:10px;margin-top:210px;text-align:center}
.map-info{padding:13px;border:1px solid var(--line);border-radius:14px;background:#17283d;margin-top:10px}
.map-info b{display:block}.map-info p{font-size:12px;color:var(--muted);margin:5px 0 0}
.vehicle-grid,.shop-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.vehicle-card,.shop-card{min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:16px;background:linear-gradient(155deg,#1a2b43,#111c2d);padding:13px;animation:card-arrive .35s ease both}
.vehicle-art,.shop-art{height:92px;border-radius:12px;background:radial-gradient(ellipse at 50% 75%,#52708b55,transparent 68%),linear-gradient(145deg,#253d59,#142238);display:grid;place-items:center;font-size:43px;margin-bottom:11px}
.vehicle-card b,.shop-card b{display:block;font-size:13px;overflow-wrap:anywhere}
.vehicle-card p,.shop-card p{font-size:11px;color:var(--muted);margin:5px 0 10px;min-height:32px}
.vehicle-meta{font-size:10px;color:#d8c08f;margin-bottom:9px}
.shop-price{font-size:12px;color:#e4c78e;font-weight:800;margin:8px 0}
.shop-search{width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--line);background:#0d192a;color:var(--text);font:inherit;margin:10px 0 2px;outline:none}
.shop-search:focus{border-color:var(--gold)}
@media(max-width:350px){.map-district{min-width:91px;padding:8px 7px}.vehicle-grid,.shop-grid{grid-template-columns:1fr}.vehicle-art,.shop-art{height:75px}}


/* Quest, achievement and event panels */
.quest-list,.achievement-grid,.event-list{display:grid;gap:11px;margin-top:12px}
.quest-card,.achievement-card,.event-card{border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#1a2b43,#111c2d);padding:14px;animation:card-arrive .3s ease both}
.quest-top,.event-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.quest-card b,.achievement-card b,.event-card b{font-size:14px;display:block}
.quest-desc,.achievement-desc,.event-desc{font-size:12px;color:var(--muted);margin:6px 0 10px}
.quest-status{font-size:10px;font-weight:800;letter-spacing:.04em;padding:5px 8px;border-radius:20px;background:#31445d;color:#c6d6e8;white-space:nowrap}
.quest-status.done{background:#244b3d;color:#a6e4c2}.quest-status.ready{background:#5b4828;color:#f2d69a}
.quest-track{height:7px;border-radius:10px;background:#091321;overflow:hidden;margin:10px 0}
.quest-fill{height:100%;width:0;background:linear-gradient(90deg,#4c86c6,var(--gold));border-radius:10px;transition:width .65s ease}
.quest-rewards{display:flex;gap:6px;flex-wrap:wrap}
.quest-rewards span{font-size:10px;padding:5px 8px;border-radius:9px;background:#263852;color:#d6e2f0}
.quest-action{margin-top:11px;width:100%}
.achievement-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.achievement-card{min-height:132px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between}
.achievement-icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#55452f;color:#f2d69a;font-size:20px;margin-bottom:10px}
.achievement-date{font-size:10px;color:#c5ad7f;margin-top:9px}
.event-time{font-size:10px;color:#e2c58b;white-space:nowrap}
.event-action{width:100%;margin-top:10px}
@media(max-width:350px){.achievement-grid{grid-template-columns:1fr}}

</style></head>
<body><main class="app">
<div class="top"><div class="brand">VISE RUSSIA</div><div class="city">● MOSCOW ROLEPLAY</div></div>
<section id="home">
<div class="hero"><div class="eyebrow">ГОРОД ЖДЁТ ТЕБЯ</div><h1>Добро пожаловать<br>в Москву</h1><p id="greeting">Загружаем профиль игрока…</p>
<div class="stats"><div class="stat"><b id="coins">—</b><span>МОНЕТЫ</span></div><div class="stat"><b id="xp">—</b><span>ОПЫТ</span></div><div class="stat"><b id="rep">—</b><span>РЕПУТАЦИЯ</span></div></div></div>
<h2 class="section-title">Городские сервисы</h2><div class="grid" id="tiles"></div>
<div class="panel"><b>📢 Новости города</b><p>Новые возможности и события появятся здесь.</p></div>
</section>
<section id="detail" class="hidden"><button class="back" id="back">← Назад</button><div class="hero"><div class="eyebrow">РАЗДЕЛ ГОРОДА</div><h1 id="detail-title">Раздел</h1><p id="detail-desc"></p></div><div class="panel"><b id="detail-heading">Данные раздела</b><div id="detail-content" class="loading">Загрузка…</div></div></section>
</main>
<nav class="nav"><button class="active" data-tab="home"><span>⌂</span>Главная</button><button data-tab="profile"><span>◉</span>Профиль</button><button data-tab="city"><span>▦</span>Город</button><button data-tab="more"><span>☷</span>Ещё</button></nav>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
const items=[
['Москва','🏙','Городская жизнь','Городские сервисы и активности'],
['Работа','💼','Карьера и заработок','Работа, вакансии и смены'],
['Магазин','🛒','Покупки','Товары и игровые предметы'],
['Фракции','🛡','Государство и организации','Вступление и информация о фракциях'],
['Предприятия','🏢','Бизнес города','Городские предприятия'],
['Развлечения','🎡','Досуг','Мероприятия и активности'],
['Телефон','📱','Связь','Игровой телефон'],
['Карта','🗺','Навигация','Карта города'],
['Места','📍','Локации','Важные места Москвы'],
['События','📅','Афиша','Городские события'],
['Семья','👥','Сообщество','Семья и участники'],
['Задания','📋','Цели и награды','Квесты и достижения']
];
const tiles=document.getElementById('tiles');
items.forEach(([name,icon,sub,desc],index)=>{const b=document.createElement('button');b.className='tile';b.style.setProperty('--tile-index',index);b.innerHTML='<span class="emoji">'+icon+'</span><b>'+name+'</b><small>'+sub+'</small>';b.setAttribute('aria-label',name+' — '+sub);b.addEventListener('click',()=>openSection(name,desc));tiles.appendChild(b)});
async function api(action,extra={}){if(!tg?.initData)throw new Error('Открой приложение через Telegram.');const res=await fetch('/api/webapp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({init_data:tg.initData,action,...extra})});const data=await res.json();if(!res.ok)throw new Error(data.error||'Ошибка запроса');return data}
const content=document.getElementById('detail-content');
function card(title,desc,button,label='Открыть'){const el=document.createElement('div');el.className='action-card';const h=document.createElement('b');h.textContent=title;el.appendChild(h);if(desc){const p=document.createElement('p');p.textContent=desc;el.appendChild(p)}if(button){const row=document.createElement('div');row.className='action-row';const b=document.createElement('button');b.className='action-btn primary';b.textContent=label;b.onclick=button;row.appendChild(b);el.appendChild(row)}return el}
function actionButton(text,fn){const b=document.createElement('button');b.className='action-btn';b.textContent=text;b.onclick=fn;return b}
async function runAction(action,extra={}){try{const d=await api(action,extra);notify(d.message||'Готово');if(d.profile)updateStats(d.profile);return d}catch(e){notify(e.message,true);throw e}}

function notify(msg,error=false){const n=document.createElement('div');n.className='notice'+(error?' error':'');n.textContent=msg;n.style.position='relative';content.prepend(n);setTimeout(()=>{n.style.opacity='0';n.style.transform='translateY(-5px)';setTimeout(()=>n.remove(),220)},3200)}


function animateValue(el,value){const target=Number(value)||0;const start=Number(el.dataset.value||0);el.dataset.value=String(target);if(window.matchMedia?.('(prefers-reduced-motion: reduce)').matches){el.textContent=target.toLocaleString('ru-RU');return}const duration=520,started=performance.now();function frame(now){const t=Math.min(1,(now-started)/duration),eased=1-Math.pow(1-t,3);el.textContent=Math.round(start+(target-start)*eased).toLocaleString('ru-RU');if(t<1)requestAnimationFrame(frame)}requestAnimationFrame(frame)}
function updateStats(p){animateValue(document.getElementById('coins'),p.coins);animateValue(document.getElementById('xp'),p.xp);animateValue(document.getElementById('rep'),p.reputation)}

async function openSection(name,desc){window.scrollTo({top:0,behavior:'smooth'});document.getElementById('home').classList.add('hidden');document.getElementById('detail').classList.remove('hidden');document.getElementById('detail-title').textContent=name;document.getElementById('detail-desc').textContent=desc;document.getElementById('detail-heading').textContent=name;content.replaceChildren();const loading=document.createElement('div');loading.className='loading';loading.textContent='Загрузка данных…';content.appendChild(loading);tg?.HapticFeedback?.impactOccurred('light');
try{
const route={'Профиль игрока':'profile','Магазин':'shop','Инвентарь':'inventory','Недвижимость':'property','Гараж':'garage','Фракции':'factions','Семья':'family','Работа':'jobs','Предприятия':'jobs','Москва':'profile','Главная':'profile','Задания':'quests','Достижения':'achievements','Рейтинг':'leaderboard','Репутация':'reputation','События':'events','Турниры':'tournaments','Транспорт':'transport'};
const data=await api(route[name]||'profile');content.replaceChildren();
