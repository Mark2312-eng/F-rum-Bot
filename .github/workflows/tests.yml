name: Tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check Mini App JavaScript syntax
        run: |
          python -c "import re; from pathlib import Path; html=Path('webapp/index.html').read_text(); match=re.search(r'<script>([\\s\\S]*?)</script>', html); assert match, 'Mini App script not found'; Path('/tmp/webapp.js').write_text(match.group(1))"
          node --check /tmp/webapp.js
